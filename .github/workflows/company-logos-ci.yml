name: Company logos validation

on:
  push:
    branches:
      - feat/company-logos
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build
