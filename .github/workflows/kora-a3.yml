name: KORA A3 quality and database integration
on:
  push:
    branches:
      - fix/kora-a3-tracabilite-appels-payants
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: "1.2.19"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p .
      - name: ESLint A3 source and integration (excluding generated code)
        run: >-
          bunx eslint
          src/server/services/usage.ts
          src/server/domain/budget.ts
          src/server/store/db.ts
          src/server/store/memory.ts
          src/server/store/paid-attempts.ts
          src/test/server/budget.test.ts
          src/test/server/paid-attempts-a3.test.ts
          tests/integration/a3/db-repository.ts
      - run: bun run test
      - run: bun --no-env-file run build
      - run: git diff --check
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: "1.2.19"
      - run: bun install --frozen-lockfile
      - name: Run disposable PostgreSQL/PostgREST integration
        env:
          SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
        run: bash scripts/test-a3-postgres.sh
