name: KORA A3 quality and database integration
on:
  push:
    branches:
      - fix/kora-a3-tracabilite-appels-payants
      - fix/kora-a4-concurrence-reprise
      - fix/kora-a4-2-fusion-defusion
  pull_request:
    branches:
      - main
      - fix/kora-a3-tracabilite-appels-payants
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: "1.2.19"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p .
      - name: ESLint global (application et code genere)
        run: bun run lint
      - run: bun run test
      - run: bun --no-env-file run build
      - run: git diff --check
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: "1.2.19"
      - run: bun install --frozen-lockfile
      - name: Run disposable PostgreSQL/PostgREST integration
        env:
          SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
        run: bash scripts/test-a3-postgres.sh
